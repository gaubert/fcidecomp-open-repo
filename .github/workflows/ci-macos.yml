name: ci-macos

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install deps
        run: |
          brew update
          brew install cmake hdf5 zlib netcdf git-lfs charls
          git lfs install

      - name: Print runner info
        run: |
          uname -a
          sw_vers
          cmake --version
          clang --version
          h5dump -V || true
          ncdump -version || true

      - name: Configure
        run: |
          cmake -S src/fcidecomp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCHARLS_ROOT="$(brew --prefix charls)"

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/install"

      - name: Post-install test
        run: |
          export HDF5_PLUGIN_PATH="$GITHUB_WORKSPACE/install/hdf5/lib/plugin"
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/lib:$GITHUB_WORKSPACE/install/hdf5/lib:$DYLD_LIBRARY_PATH"
          ./src/fcidecomp/fcidecomp-test/postInstallationTest.sh
