name: ci-linux

on:
  push:
  pull_request:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Print runner info
        run: |
          uname -a
          lsb_release -a 2>/dev/null || cat /etc/os-release
          cmake --version
          gcc --version
          g++ --version
          h5dump -V || true
          ncdump -V || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libhdf5-dev hdf5-tools zlib1g-dev libcharls-dev git-lfs netcdf-bin
          git lfs install

      - name: Configure
        working-directory: src/fcidecomp
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: Build
        working-directory: src/fcidecomp
        run: cmake --build build --config Release

      - name: Install
        working-directory: src/fcidecomp
        run: cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/install"

      - name: Post-install test
        env:
          HDF5_PLUGIN_PATH: ${{ github.workspace }}/install/hdf5/lib/plugin
        run: |
          cd src/fcidecomp
          ./fcidecomp-test/postInstallationTest.sh

  build-almalinux:
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Print runner info
        run: |
          uname -a
          cat /etc/os-release
          cmake --version
          gcc --version
          g++ --version
          h5dump -V || true
          ncdump -V || true

      - name: Install deps
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y git git-lfs gcc gcc-c++ make cmake zlib zlib-devel hdf5 hdf5-devel netcdf netcdf-devel curl-minimal diffutils
          git lfs install

      - name: Build CharLS
        run: |
          curl -L -o /tmp/charls-2.4.2.tar.gz https://github.com/team-charls/charls/archive/refs/tags/2.4.2.tar.gz
          tar -xzf /tmp/charls-2.4.2.tar.gz -C /tmp
          cmake -S /tmp/charls-2.4.2 -B /tmp/charls-2.4.2/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX=/opt/charls
          cmake --build /tmp/charls-2.4.2/build --config Release
          cmake --install /tmp/charls-2.4.2/build --config Release

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure
        run: |
          cmake -S src/fcidecomp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCHARLS_ROOT=/opt/charls

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release --prefix /opt/fcidecomp

      - name: Post-install test
        env:
          HDF5_PLUGIN_PATH: /opt/fcidecomp/hdf5/lib/plugin
        run: ./src/fcidecomp/fcidecomp-test/postInstallationTest.sh
