name: ci-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure vcpkg root is set
        shell: pwsh
        run: |
          if (-not $Env:VCPKG_ROOT) {
            if ($Env:VCPKG_INSTALLATION_ROOT) {
              $Env:VCPKG_ROOT = $Env:VCPKG_INSTALLATION_ROOT
            } else {
              $Env:VCPKG_ROOT = 'C:\vcpkg'
            }
          }
          "VCPKG_ROOT=$Env:VCPKG_ROOT" | Out-File -FilePath $Env:GITHUB_ENV -Append

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          git lfs install
          & "$Env:VCPKG_ROOT\vcpkg.exe" install `
            charls:x64-windows-static `
            hdf5[cpp,zlib]:x64-windows-static `
            netcdf-c[tools]:x64-windows-static

      - name: Print runner info
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object OsName, OsVersion, WindowsVersion
          cmake --version
          & "$Env:VCPKG_ROOT\installed\x64-windows-static\tools\netcdf-c\ncdump.exe" --version

      - name: Configure
        shell: bash
        run: |
          cmake -S src/fcidecomp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCHARLS_ROOT=$VCPKG_ROOT/installed/x64-windows-static \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Install
        shell: bash
        run: cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/install"

      - name: Post-install test
        shell: bash
        run: |
          VCPKG_ROOT_POSIX="$(cygpath -u "$VCPKG_ROOT")"
          WORKSPACE_POSIX="$(cygpath -u "$GITHUB_WORKSPACE")"
          WORKSPACE_WIN="$(cygpath -w "$GITHUB_WORKSPACE")"
          export PATH="$WORKSPACE_POSIX/install/hdf5/bin:$WORKSPACE_POSIX/install/bin:$VCPKG_ROOT_POSIX/installed/x64-windows-static/tools/netcdf-c:$PATH"
          export HDF5_PLUGIN_PATH="$WORKSPACE_WIN\\install\\hdf5\\bin;$WORKSPACE_WIN\\install\\hdf5\\lib\\plugin"
          cd "$WORKSPACE_POSIX/src/fcidecomp"
          ./fcidecomp-test/postInstallationTest.sh
