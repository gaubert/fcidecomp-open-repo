name: ci-windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure vcpkg root is set
        shell: pwsh
        run: |
          if (-not $Env:VCPKG_ROOT) {
            if ($Env:VCPKG_INSTALLATION_ROOT) {
              $Env:VCPKG_ROOT = $Env:VCPKG_INSTALLATION_ROOT
            } else {
              $Env:VCPKG_ROOT = 'C:\vcpkg'
            }
          }
          "VCPKG_ROOT=$Env:VCPKG_ROOT" | Out-File -FilePath $Env:GITHUB_ENV -Append

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-windows-2025-vs2026-x64-windows-static-${{ hashFiles('**/conda/**', '**/CMakeLists.txt', '**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-windows-2025-vs2026-x64-windows-static-

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          git lfs install
          & "$Env:VCPKG_ROOT\vcpkg.exe" install `
            charls:x64-windows-static `
            hdf5[cpp,tools,zlib]:x64-windows-static `
            netcdf-c[tools]:x64-windows-static

      - name: Print runner info
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object OsName, OsVersion, WindowsVersion
          cmake --version
          & "$Env:VCPKG_ROOT\installed\x64-windows-static\tools\hdf5\h5dump.exe" --version
          & "$Env:VCPKG_ROOT\installed\x64-windows-static\tools\netcdf-c\ncdump.exe" --version
          $global:LASTEXITCODE = 0

      - name: Configure
        shell: bash
        run: |
          cmake -S src/fcidecomp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCHARLS_ROOT=$VCPKG_ROOT/installed/x64-windows-static \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Install
        shell: bash
        run: cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/install"

      - name: Post-install test
        shell: pwsh
        run: |
          $Env:PATH = "$Env:GITHUB_WORKSPACE\install\bin;$Env:GITHUB_WORKSPACE\install\hdf5\lib\plugin;$Env:VCPKG_ROOT\installed\x64-windows-static\tools\netcdf-c;$Env:VCPKG_ROOT\installed\x64-windows-static\tools\hdf5;$Env:PATH"
          $Env:HDF5_PLUGIN_PATH = "$Env:GITHUB_WORKSPACE\install\hdf5\lib\plugin"
          Set-Location "$Env:GITHUB_WORKSPACE\src\fcidecomp"
          cmd /c "fcidecomp-test\postInstallationTest.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
